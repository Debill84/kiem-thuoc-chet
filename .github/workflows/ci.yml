name: CI
# Kho này LÀ cái gác của nhà ⇒ nó phải tự chịu đúng luật nó áp cho người khác.
# `npm test` = (1) tự kiểm BỘ LUẬT bằng đối chứng ÂM + DƯƠNG, (2) đem chính kho này ra soi.
# Cố ý KHÔNG `npm ci`: gói này KHÔNG có phụ thuộc nào (đó là điều kiện để CI của các kho khác
# kéo về được trong ~5 giây mà không cần chìa) — có `node` là chạy.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  luoi:
    name: Tự kiểm bộ luật + tự soi mình
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cú pháp
        run: node --check kiem.mjs

      # ⚠️ Gói này phải giữ ĐÚNG 0 phụ thuộc. Thêm một gói là mọi CI đang kéo bằng tarball
      #    phải cài thêm cây phụ thuộc ⇒ chậm + có thể cần chìa ⇒ mất đúng lý do nó tồn tại.
      - name: Chốt "0 phụ thuộc"
        run: |
          node -e '
            const p = require("./package.json");
            const n = Object.keys(p.dependencies ?? {}).length;
            if (n) { console.error(`❌ gói này phải có 0 phụ thuộc, đang có ${n}`); process.exit(1); }
            console.log("✅ 0 phụ thuộc — CI kho khác kéo về được không cần chìa");
          '

      - name: npm test (tự kiểm bộ luật + tự soi mình)
        run: npm test

      # 🩸 Chốt cho một lỗi CÂM đã trả giá lúc dựng (31/07): npm cài xong thì `.bin/kiem-thuoc-chet`
      # là SYMLINK; gọi qua nó thì `process.argv[1]` là đường symlink còn `import.meta.url` là đường
      # thật ⇒ chốt "có phải chạy thẳng không" lệch ⇒ cái gác IM LẶNG THOÁT 0. Trên máy gác nó
      # trông y hệt "đã chạy và xanh". Chạy `node kiem.mjs` KHÔNG bao giờ lòi ra loại này ⇒ phải
      # gọi qua ĐÚNG đường mà kho khác sẽ gọi.
      - name: Chốt "gọi qua symlink .bin vẫn chạy THẬT" (chống lỗi câm)
        run: |
          npm i --no-save --prefix /tmp/thu "$(pwd)"
          BIN=/tmp/thu/node_modules/.bin/kiem-thuoc-chet
          "$BIN" --tu-kiem | tee /tmp/ra.txt
          grep -q 'bộ luật tự kiểm đạt' /tmp/ra.txt \
            || { echo "❌ gọi qua .bin KHÔNG in gì — lỗi câm đã quay lại"; exit 1; }
          # và phải biết ĐỎ: soi một kho giả có thước chết thì rc phải là 1
          mkdir -p /tmp/kho-hong
          echo '{"name":"x","scripts":{"test":"echo ok","kiem-chet":"node k.mjs"}}' > /tmp/kho-hong/package.json
          if "$BIN" --kho /tmp/kho-hong; then echo "❌ kho có thước chết mà vẫn XANH"; exit 1; fi
          echo "✅ .bin chạy thật, và biết đỏ đúng chỗ"

  secret-scan:
    name: Quét secret rò (gitleaks — toàn kho)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Quét secret rò (gitleaks — toàn kho, ĐỎ nếu có leak)
        run: |
          VER=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --exit-code 1
